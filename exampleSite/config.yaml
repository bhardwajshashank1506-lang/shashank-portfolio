  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/FormalPic.jpg"
    content: |-
      I am a Senior Software Engineer with 8+ years of experience in backend development, distributed data systems, cloud technologies, and AI solutions. At Intuit, I lead the engineering team behind Ceres, an enterprise-grade data platform serving 40,000 TPS of real-time data and powering search and AI for TurboTax and QuickBooks.

      Previously, I spent 6+ years at UnitedHealth Group, working my way up to Engineering Lead and building globally deployed healthcare claims platforms. I hold a Master of Engineering in Cloud Engineering from the University of Maryland, College Park (4.00 GPA), and have two patents to my name.

    skills:
      enable: true
      title: "Here are the technologies I've experience working with:"
      items:
        - "BACKEND DEVELOPMENT: Java, Kotlin, Spring, Python, Kafka, Flink, Spark, GraphQL, FastAPI"
        - "DATABASE & SEARCH: Elasticsearch, OracleDB, PostgreSQL, DynamoDB/DAX, Redis, Databricks, Hive"
        - "CLOUD & DEVOPS: Kubernetes, Docker, Jenkins, AWS, GCP, Airflow, Splunk, Prometheus"
        - "AI & ML: PyTorch, TensorFlow, AI Harness, LangChain, LangGraph, SageMaker"
        - "FRONTEND DEVELOPMENT: JavaScript, React JS, Bootstrap, HTML, CSS"

  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - job: "Senior Software Engineer"
        company: "Intuit Inc."
        companyUrl: "https://www.intuit.com/"
        date: "May 2025 - Present"
        featuredLink:
          enable: false
        info:
          enable: true
          content: Powering data, intelligence and search across TurboTax and QuickBooks.
        content: |
          - Led the engineering team in designing, architecting, and deploying **Ceres** - a unified, enterprise-grade **data platform** powering all data, intelligence, and search capabilities across **TurboTax** and **QuickBooks**.
          - Built a distributed data streaming framework with **100+ real-time pipelines** that handle ingestion, transformation, indexing, and ranking for all TurboTax and QuickBooks transactions, achieving **40,000 TPS**, **p99 latency under 300 ms**, and guaranteed consumption and delivery.
          - Ideated, designed, developed, and **patented** a real-time data stream composition framework to aggregate n-live data streams into a single stream, where each stream can have varied latency for correlated events. (**US 19/664986**)
          - Developed a data access layer by building a secure **GraphQL** API with **Redis** caching across OpenSearch, serving **20000 TPS** with **99.999% availability** and **< 1sec** latency for all search, auto-complete, and AI use cases of TurboTax and QuickBooks.
          - Created **CeresAssist**, a **FastAPI** and **LangGraph**-powered **AI agent** that serves as an operational assistant for data analysis and system diagnostics, automating onboarding, alerting, and manual investigations across **200+ applications**.
          - Designed and deployed an **AI Intent Classification** service to enable real-time query categorization and enhance search relevance; engineered **SageMaker**-backed training and high-throughput inference APIs capable of serving **2,000 TPS** with a **0.91 F1-score**.
          - Architected and implemented a configuration-driven **Disaster Recovery agent** to automate seamless failover across **4** core applications, encompassing > 500 replicas, > 400 OpenSearch nodes, and multiple Redis clusters; successfully redirected live customer traffic in **< 10 minutes** while sustaining **p95** latency **< 1 sec**.

      - job: "Senior Software Engineer"
        company: "UnitedHealth Group"
        companyUrl: "https://www.unitedhealthgroup.com/"
        date: "Jan 2020 - Dec 2023"
        featuredLink:
          enable: false
        info:
          enable: true
          content: Engineering Lead for globally deployed healthcare claims platforms.
        content: |
          - As Engineering Lead, designed, developed, and globally deployed a claim correction application using a multi-tiered distributed **Microservices** Architecture.
          - Built a Rules Engine as a Service using **Java**, **Spring**, **Oracle DB**, and **Kafka** to validate and correct more than **20 million claims/min** for universal healthcare providers.
          - Constructed secure and extensible cloud Infrastructure using **Kubernetes**, **AWS** and **Airflow**.
          - Developed and **patented** a comprehensive enterprise authentication mechanism to authenticate both UI and APIs utilizing **OAuth 2.0**, **Stargate**, **LDAP**, and **JWT**.
          - Created an **AI Agent** to automate test data mockup of legacy claim data using **OpenAI** and **Ollama**.

      - job: "Software Engineer"
        company: "UHG"
        companyUrl: "https://www.unitedhealthgroup.com/"
        date: "Jul 2017 - Dec 2020"
        featuredLink:
          enable: false
        info:
          enable: true
          content: Started my professional journey here, building claim validation systems.
        content: |
          - **Full Stack Development** New Jersey PreValidation application using **React** and **JavaScript**, delivering value to New Jersey Medicaid plan operator's insurance claim validations.
          - Developed a distributed architecture of **Spark** and REST APIs to process and validate **6,000 healthcare claims per second**.
          - Created **Automated Test Cases** using **Selenium** and **Cucumber** to streamline compliance and quality SLAs, integrating them into deployment pipelines.

